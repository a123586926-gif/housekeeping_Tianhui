name: Housekeeping auth branch checks
on:
  push:
    branches:
      - feature/remember-login-30d
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check helper regression tests
        run: node --test tests/auth-validators.test.js tests/default-rooms.test.js tests/cleaner-validation.test.js tests/cleaner-management-policy.test.mjs tests/qa-cleaner-management-contract.test.mjs tests/qa-environment-guard.test.mjs tests/production-compatibility.test.mjs tests/production-account-dry-run.test.mjs tests/production-photo-migration-audit.test.mjs tests/restore-readiness.test.mjs tests/local-production-backup.test.mjs
      - name: Build existing React application
        run: npm run build
